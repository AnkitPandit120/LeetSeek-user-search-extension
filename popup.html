<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeetPulse</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-card">
    <!-- Top Navigation Tabs -->
    <div class="tabs-header">
      <button class="tab-button active" data-tab="stalker-tab">LeetPulse</button>
      <button class="tab-button" data-tab="search-tab">Contest Search</button>
    </div>

    <!-- TAB 1: STALKER VIEW -->
    <div id="stalker-tab" class="tab-content active">
      <div class="header-stalker">
        <h1 class="logo-title-stalker">LeetPulse <span class="logo-icon-img">⚡</span></h1>
        <button class="theme-toggle-btn refresh-btn" title="Toggle Day Mode">☀️</button>
      </div>

      <!-- User Greeting Section -->
      <div id="user-greeting-section" class="user-greeting-card">
        <!-- Will be dynamically populated. Either:
             1. Welcome: "Hello 👋, {Username} !" + "Change Username" link
             2. Onboarding: "Set your LeetCode Username" input + "Save" button
        -->
        <div class="greeting-loading">Loading configuration...</div>
      </div>

      <!-- Add Friend Section -->
      <div class="add-friend-section">
        <div class="input-group">
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input type="text" id="friend-username-input" placeholder="Friend's username" />
          </div>
          <button id="add-friend-btn" class="btn primary-btn">
            <svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px; margin-right: 5px;">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            Add
          </button>
        </div>
        <div id="add-friend-status" class="status-msg"></div>
      </div>

      <!-- Search & Filters Section -->
      <div class="filter-section">
        <div class="search-bar-container">
          <span class="search-icon-left">🔍</span>
          <input type="text" id="search-friends-input" placeholder="Search Friends" />
        </div>
        <div class="control-actions">
          <select id="sort-friends-select" class="dropdown-select">
            <option value="alpha">Sort Alphabetically</option>
            <option value="total">Sort by Total Solved</option>
            <option value="rating">Sort by Rating</option>
          </select>
          <button id="show-chart-btn" class="refresh-btn" title="View Progress Graph">
            <svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;">
              <line x1="18" y1="20" x2="18" y2="10" stroke="#0284c7" stroke-width="3"></line>
              <line x1="12" y1="20" x2="12" y2="4" stroke="#ea580c" stroke-width="3"></line>
              <line x1="6" y1="20" x2="6" y2="14" stroke="#0d9488" stroke-width="3"></line>
            </svg>
          </button>
          <button id="refresh-all-btn" class="refresh-btn" title="Refresh all statistics">
            <div class="refresh-icon-circle">
              <svg class="refresh-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"></path>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </div>
          </button>
        </div>
      </div>

      <!-- Friends List Container -->
      <div id="friends-list-container" class="friends-list scrollable">
        <!-- Dynamically rendered cards -->
      </div>
    </div>

    <!-- TAB 2: CONTEST SEARCH VIEW (Original LeetSeek) -->
    <div id="search-tab" class="tab-content">
      <div class="header">
        <div class="header-left">
          <span class="logo-icon">🔍</span>
          <h1 class="logo-title">LeetSeek</h1>
        </div>
        <button class="theme-toggle-btn refresh-btn" title="Toggle Day Mode">☀️</button>
      </div>

      <!-- Active Search Control -->
      <div id="mainContainer" style="display: none;">
        <p class="info-text">Open the search panel to locate specific users or keyword groups on the leaderboards.</p>
        <button id="startSearchBtn" class="btn primary-btn">Start User Search</button>
      </div>

      <!-- Error/Wrong Page Control -->
      <div id="statusContainer">
        <p id="errorMessage" class="warn-text">Detecting active tab...</p>
        <button id="openLeetcodeBtn" class="btn secondary-btn">Go to LeetCode Contests</button>
      </div>
    </div>

    <!-- Chart Modal Overlay -->
    <div id="chart-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Progress Graph 📊</h2>
          <button id="close-modal-btn" class="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="chart-toggle-container">
            <button id="chart-toggle-solved" class="toggle-btn active">Total Solved</button>
            <button id="chart-toggle-rating" class="toggle-btn">Contest Rating</button>
          </div>
          <div class="canvas-container">
            <canvas id="friends-chart" width="340" height="230"></canvas>
          </div>
        </div>
      </div>
    </div>
    <a href="https://github.com/AnkitPandit120" id="footer-link" class="footer-signature" title="View Author GitHub">by Ankit x techsfc</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
